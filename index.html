                </div>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="text-[9px] font-bold uppercase tracking-widest text-gray-500 mb-2 px-1 flex justify-between">
                <span>Public Games</span>
                <span class="text-blue-400">1 $TALON</span>
            </h2>
            <div class="grid grid-cols-2 gap-2">
                <a href="https://eagle-tetris-game.vercel.app" onclick="updateStreak()" class="glass game-card rounded-xl flex flex-col items-center">

                </a>
                <a href="https://eagle-wheel.vercel.app" onclick="updateStreak()" class="glass game-card rounded-xl flex flex-col items-center">

                <div class="mb-5">

                <a href="https://eagle-jump.vercel.app" onclick="updateStreak()" class="glass premium-border p-3 rounded-xl flex flex-col items-center">
                    <span class="text-xl mb-1">🦘</span>

                </button>
                <button onclick="window.location.href='hall.html'" class="bg-gray-800/30 text-gray-400 text-[9px] font-bold py-2.5 rounded-lg border border-white/5 uppercase tracking-widest flex flex-col items-center">
                    <span>Hall of Fame</span>

    </div>

    <script>
        const streakEl = document.getElementById('streakCount');
        let streak = localStorage.getItem('eagleStreak') || 0;
        let lastDate = localStorage.getItem('eagleLastDate');
        streakEl.innerText = streak;

        function updateStreak() {
            const today = new Date().toDateString();
            if (lastDate !== today) {
                streak = parseInt(streak) + 1;
                localStorage.setItem('eagleStreak', streak);
                localStorage.setItem('eagleLastDate', today);
                streakEl.innerText = streak;
            }
        }

        function share() {
            const text = encodeURIComponent(`🦅 Streak: ${streak} days on TALON Arcade! 🔥 @eagle-pi`);
            window.location.href = `https://warpcast.com/~/compose?text=${text}&embeds[]=https://farcoins.vercel.app/airdrop`;
        }
    </script>
