                <a href="https://eagle-tetris-game.vercel.app" onclick="updateStreak()" class="glass game-card p-4 rounded-2xl flex flex-col items-center">

            <div class="grid grid-cols-3 gap-2">
                <a href="https://eagle-demineur.vercel.app" onclick="updateStreak()" class="glass premium-border game-card p-4 rounded-2xl flex flex-col items-center">

                <a href="https://eagle-vault.vercel.app" onclick="updateStreak()" class="glass premium-border game-card p-4 rounded-2xl flex flex-col items-center">

            <div class="grid grid-cols-2 gap-2">

                <button onclick="window.location.href='https://warpcast.com/eagle-pi'" class="bg-gray-800/40 text-gray-400 text-[10px] font-bold py-3 rounded-xl border border-white/10 uppercase tracking-widest flex flex-col items-center">

            </div>
            <button onclick="window.location.href='https://warpcast.com/eagle-pi'" class="w-full text-gray-500 text-[9px] font-bold uppercase tracking-[0.2em] py-2">
                Support Project (Tips for Build)
            </button>
        </div>
        </div>
            <script>
        const streakEl = document.getElementById('streakCount');
        let streak = localStorage.getItem('eagleStreak') || 0;
        let lastDate = localStorage.getItem('eagleLastDate');
        streakEl.innerText = streak;

        function updateStreak() {
            const today = new Date().toDateString();
            if (lastDate !== today) {
                streak = parseInt(streak) + 1;
                localStorage.setItem('eagleStreak', streak);
                localStorage.setItem('eagleLastDate', today);
                streakEl.innerText = streak;
            }
        }

        function share() {
            const text = encodeURIComponent(`🦅 Ma streak est de ${streak} jours sur la TALON Arcade ! 🔥 @eagle-pi`);
            window.location.href = `https://warpcast.com/~/compose?text=${text}&embeds[]=https://farcoins.vercel.app/airdrop`;
        }

        const EAGLE_SETTINGS = {
            slippage: "10%",
            priorityFee: 0.001,
            frontRunProtection: "Auto",
            token: "$TALON"
        };
        console.log("TALON Arcade: Sync Active.");
    </script>
