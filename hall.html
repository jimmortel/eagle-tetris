<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TALON HALL OF FAME 🏆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .podium-1 { background: linear-gradient(to bottom, rgba(245, 158, 11, 0.2), transparent); border: 1px solid rgba(245, 158, 11, 0.4); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="font-sans antialiased">
    <nav class="w-full flex justify-between items-center px-4 py-3 bg-black/40 border-b border-white/10">
        <button onclick="window.location.href='index.html'" class="text-[10px] text-gray-400 uppercase font-bold flex items-center gap-2">
            ← Arcade
        </button>
        <span class="text-[9px] font-bold tracking-widest text-amber-500 uppercase">Top Pilots Only</span>
    </nav>

    <div class="max-w-md mx-auto px-4 py-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter neon-text uppercase italic">Hall of Fame</h1>
            <p class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mt-1">Elite Rankings • Live Data</p>
        </header>

        <div id="podium" class="grid grid-cols-3 gap-2 items-end mb-8 text-center opacity-0 transition-opacity duration-500">
            </div>

        <div class="space-y-2">
            <h2 class="text-[9px] font-black uppercase text-gray-500 mb-3 tracking-widest px-1 text-center">Standard Rankings</h2>
            <div id="leaderboard-list" class="space-y-2">
                <p class="text-center text-[10px] text-gray-600 animate-pulse italic">Scanning the network...</p>
            </div>

            <div class="mt-8 p-4 border border-dashed border-white/10 rounded-2xl text-center">
                <p class="text-[8px] text-gray-500 uppercase leading-relaxed">
                    Rankings are based on <span class="text-blue-400">High Scores</span>.<br>
                    Real-time sync: <span class="text-green-500 font-bold italic">Active</span>.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Configuration Supabase
        const SUPABASE_URL = "https://rjkyjqmydriagpiatbsr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa3lqcW15ZHJpYWdwaWF0YnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMzQ5MTEsImV4cCI6MjA4OTYxMDkxMX0.4-uEBo_SFqfMgPpTuDQRxTYLeUoI_ZMZlwtkBJzK_X0";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadLeaderboard() {
            try {
                const { data, error } = await supabaseClient
                    .from('leaderboard')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(10);

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('leaderboard-list').innerHTML = '<p class="text-center text-[10px] text-gray-600">No data found. Be the first to score!</p>';
                    return;
                }

                renderPodium(data.slice(0, 3));
                renderList(data.slice(3));
            } catch (err) {
                console.error('Connection Error:', err.message);
                document.getElementById('leaderboard-list').innerHTML = '<p class="text-center text-[10px] text-red-500 italic">Connection failed. Check DB.</p>';
            }
        }

        function renderPodium(top3) {
            const podiumDiv = document.getElementById('podium');
            const p1 = top3[0] || { username: 'Empty', score: 0 };
            const p2 = top3[1] || { username: 'Empty', score: 0 };
            const p3 = top3[2] || { username: 'Empty', score: 0 };

            podiumDiv.innerHTML = `
                <div class="glass p-3 rounded-t-xl h-24 flex flex-col justify-center border-b-0">
                    <span class="text-xl mb-1 text-gray-400">🥈</span>
                    <p class="text-[9px] font-bold truncate">${p2.username}</p>
                    <p class="text-[8px] text-blue-400">${p2.score}</p>
                </div>
                <div class="glass podium-1 p-4 rounded-t-2xl h-32 flex flex-col justify-center border-b-0 relative">
                    <span class="absolute -top-3 left-1/2 -translate-x-1/2 text-2xl">👑</span>
                    <span class="text-2xl mb-1">🥇</span>
                    <p class="text-[10px] font-black truncate text-amber-500">${p1.username}</p>
                    <p class="text-[9px] text-white">${p1.score}</p>
                </div>
                <div class="glass p-3 rounded-t-xl h-20 flex flex-col justify-center border-b-0">
                    <span class="text-lg mb-1 text-orange-700">🥉</span>
                    <p class="text-[9px] font-bold truncate">${p3.username}</p>
                    <p class="text-[8px] text-blue-400">${p3.score}</p>
                </div>
            `;
            podiumDiv.classList.remove('opacity-0');
        }

        function renderList(others) {
            const listDiv = document.getElementById('leaderboard-list');
            if (others.length === 0 && document.getElementById('podium').innerHTML === "") {
                listDiv.innerHTML = '<p class="text-center text-[10px] text-gray-600 italic italic">Waiting for more challengers...</p>';
                return;
            }
            listDiv.innerHTML = others.map((player, index) => `
                <div class="glass p-3 rounded-xl flex justify-between items-center px-5 border-white/5 shadow-lg">
                    <div class="flex items-center gap-4">
                        <span class="text-[10px] font-bold text-gray-600">#${index + 4}</span>
                        <span class="text-[11px] font-medium text-gray-300 italic">${player.username}</span>
                    </div>
                    <span class="text-[10px] font-mono text-blue-400 font-bold">${player.score.toLocaleString()}</span>
                </div>
            `).join('');
        }

        // Chargement initial
        loadLeaderboard();
    </script>
</body>
</html>
